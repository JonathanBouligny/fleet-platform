apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haproxy-ingress
  # You'll usually want to add your resources to the argocd namespace.
  namespace: argocd
  # Add this finalizer ONLY if you want these to cascade delete.
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
    # Alternatively, you can use background cascading deletion
    # - resources-finalizer.argocd.argoproj.io/background
spec:
  # The project the application belongs to.
  project: default
  sources:
    - repoURL: https://haproxytech.github.io/helm-charts  # Can point to either a Helm chart repo or a git repo.
      chart: kubernetes-ingress
      targetRevision: 1.54.2
      helm:
        valueFiles:
          - $values/argocd/helm-values/ingress.yml
    - repoURL: 'ssh://git@192.168.1.30/jon/fleet-platform.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: haproxy-controller
  syncPolicy:
    syncOptions: [CreateNamespace=true]
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m