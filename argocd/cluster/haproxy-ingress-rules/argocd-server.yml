apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  # annotations:
  #   # add an annotation indicating the issuer to use.
  #   cert-manager.io/cluster-issuer: cloudflare-issuer-prod
spec:
  ingressClassName: haproxy
  rules:
  - host: "argocd.wehaveaproblem.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 443
  # tls: # < placing a host in the TLS config will determine what ends up in the cert's subjectAltNames
  # - hosts:
  #   - argocd.wehaveaproblem.net
  #   secretName: argocd-cert-prod # < cert-manager will store the created certificate in this secret.
