---
- name: Configure bootstrap secrets
  hosts: localhost
  vars:
    kubeconfig_path: "~/.kube/config"
    bootstrap_secrets:
      - { namespace: argocd, file: /home/jon/super-dumb-repos/password-files/secret-argo-forgejo.yml }
      - { namespace: cert-manager, file: /home/jon/super-dumb-repos/password-files/cloudflare-api-token.yml }
      - { namespace: haproxy-controller, file: /home/jon/super-dumb-repos/password-files/wehaveaproblem-net.yml }
  tasks:
    - name: Make sure namespaces for the secrets exist
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        name: "{{ item.namespace }}"
        kind: Namespace
      loop: "{{ bootstrap_secrets }}"

    - name: Apply secrets in loop
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        namespace: "{{ item.namespace }}"
        state: present
        apply: true
        src: "{{ item.file }}"
      loop: "{{ bootstrap_secrets }}"
      no_log: true
